[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gvr"
version = "0.2.0"
description = "Deterministic evidence-backed verification runtime"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
gvr = "gvr.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
