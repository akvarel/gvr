name: GVR CI

on:
  push:
    branches:
      - integration/v1
      - 'feature/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: gvr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip '.[dev]' build
      - name: Test
        run: python -m pytest -o addopts='' -q
      - name: Compile
        run: python -m compileall -q src
      - name: Build package
        run: python -m build
      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Installed package smoke
        run: |
          python -c "import gvr; print(gvr.__name__)"
          gvr --request '{"schema_version":1,"op":"verify_text_search","payload":{"corpus":["alpha"],"needle":"a","claimed_matches":["alpha"]}}'
      - name: Diff hygiene
        run: git diff --check
